name: Daily trust contact index (Find a Tender)

# Builds data/trust-contacts.json — named contacts on NHS trusts' own public
# procurement notices — and data/people-moves.json, the observed changes that
# fall out of tracking those names over time.
#
# ⚠️ WHY DAILY AND NOT ONE BIG BACKFILL. The Find a Tender OCDS API returns
# HTTP 429 with Retry-After after a small number of requests (observed
# 24/07/2026: about a dozen calls, Retry-After 120s). Scanning a long period in
# one run is not possible. This scans a short rolling window each day and
# appends, so coverage accumulates. Do not widen --days to "catch up faster" —
# you will just spend the whole run sleeping on 429s.
#
# The window is 4 days, not 1, so a single failed run self-heals the next day.

on:
  schedule:
    - cron: "40 5 * * *"     # daily 05:40 UTC, after the weekly trust refresh
  workflow_dispatch:
    inputs:
      days:
        description: "How many days back to scan (default 4)"
        required: false
        default: "4"

# ⚠️ ADDED 26/07/2026. All three writers push to this one repo on overlapping
# schedules and none of them had a concurrency group, so a long job could lose a
# race it had already done the work for. On 26/07 the weekly refresh ran for 49
# minutes, then its push was REJECTED ("fetch first") because daily-contacts.yml
# landed at 07:56 inside that window. Three files of computed NHSSC cache and
# trust-directory data were discarded and the trust directory did not refresh
# that week. This group serialises the writers so they queue instead of racing.
concurrency:
  group: msh-compare-data-writer
  cancel-in-progress: false
permissions:
  contents: write

jobs:
  contacts:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Scan Find a Tender for named NHS trust contacts
        run: python scripts/refresh_fts_contacts.py --days ${{ github.event.inputs.days || 4 }}
      - name: Publish gate — nothing commits until this passes
        run: python3 verify.py
      - name: Commit if changed
        run: |
          git config user.name "hub-bot"
          git config user.email "contact@elevateandthrive.uk"
          git add data/trust-contacts.json data/people-moves.json
          git diff --cached --quiet || git commit -m "trust contact index $(date -u +'%F')"
          # ⚠️ ADDED 26/07/2026. A bare `git push` here silently threw away completed
          # work whenever another writer landed first. Retry on rebase, and RE-RUN
          # THE GATE after any rebase: the rebase combines this run's data with
          # another writer's, and that combination has not been gated yet. Root
          # CLAUDE.md rule 13 - if the gate fails, the data is wrong, so refuse to
          # push rather than loosening anything.
          pushed=0
          for attempt in 1 2 3 4 5; do
            if git push; then
              echo "pushed on attempt $attempt"
              pushed=1
              break
            fi
            echo "push rejected (another writer landed first). Rebasing and re-running the gate, attempt $attempt of 5."
            git pull --rebase --autostash
            python3 verify.py || { echo "GATE FAILED after rebase - refusing to push"; exit 1; }
            sleep 5
          done
          if [ "$pushed" -ne 1 ]; then
            echo "could not push after 5 attempts - failing loudly rather than dropping the work"
            exit 1
          fi
      - name: Phone alert on failure (ntfy)
        if: failure()
        run: |
          curl -s -H "Title: Medical Sales Hub - contact index FAILED" -H "Priority: default" -H "Tags: warning" \
            -d "The daily Find a Tender contact scan failed. The Stakeholder Mapper still works; the names panel just stops updating. Check github.com/louisehoult-beep/msh-compare-data/actions" \
            ntfy.sh/eth-hub-lou-4437
