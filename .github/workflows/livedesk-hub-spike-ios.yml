# Live Desk app, Hub tab spike (plan step A): compile the iOS app and probe the
# Hub view in an iPhone simulator, logged out. Test only: no signing, no upload,
# nothing to the stores. Runs on pushes to the spike branch only.
name: livedesk-hub-spike-ios
on:
  push:
    branches: [livedesk-hub-spike]
    paths: ['livedesk-app/**', '.github/workflows/livedesk-hub-spike-ios.yml']
permissions:
  contents: read
concurrency:
  group: livedesk-hub-spike-ios
  cancel-in-progress: true
jobs:
  ios-sim:
    runs-on: macos-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: livedesk-app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Xcode
        run: |
          latest=$(ls -d /Applications/Xcode_*.app | sort -V | tail -1)
          sudo xcode-select -s "$latest"
          xcodebuild -version
      - name: Web build and sync
        run: |
          npm ci
          HUB_SPIKE=1 npm run build
          npx cap sync ios
      - name: Compile (simulator, Debug, unsigned)
        run: |
          set -o pipefail
          xcodebuild -project ios/App/App.xcodeproj -scheme App -configuration Debug \
            -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build CODE_SIGNING_ALLOWED=NO build | tail -40
      - name: Probe the Hub view in a simulator (logged out)
        run: |
          mkdir -p ../evidence
          udid=$(xcrun simctl list devices available -j | python3 -c "import json,sys;d=json.load(sys.stdin)['devices'];print(next(x['udid'] for k,v in d.items() if 'iOS' in k for x in v if x['name'].startswith('iPhone')))")
          echo "device $udid"
          xcrun simctl boot "$udid"; xcrun simctl bootstatus "$udid" -b
          app=$(ls -d build/Build/Products/Debug-iphonesimulator/*.app | head -1)
          xcrun simctl install "$udid" "$app"
          bid=uk.co.medsalesintelligencehub.livedesk
          xcrun simctl spawn "$udid" log stream --style compact --predicate 'eventMessage CONTAINS "MSHHubProbe"' > ../evidence/ios-probe.log 2>&1 &
          LOG=$!
          for page in login medical-sales-hub/my-hub medical-sales-hub/urology medical-sales-hub/calendar; do
            slug=$(echo "$page" | tr '/' '-')
            xcrun simctl terminate "$udid" "$bid" || true
            xcrun simctl launch "$udid" "$bid" -hubUrl "https://medsalesintelligencehub.co.uk/$page/"
            sleep 40
            xcrun simctl io "$udid" screenshot "../evidence/ios-$slug.png"
          done
          kill $LOG || true
          cat ../evidence/ios-probe.log
          grep -q 'MSHLiveDeskApp/ios' ../evidence/ios-probe.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ios-hub-spike-evidence
          path: evidence/
