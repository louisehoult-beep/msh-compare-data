name: Speciality panels rebuild

# Rebuilds every data/speciality-panels/<slug>.json from the frameworks, award,
# tender and tariff feeds. app/speciality-panels.js loads them into the Hub's
# speciality pages, so whatever is committed here is what a member reads.
#
# WHY THIS EXISTS (18/09/2026, ^o538)
#   It didn't. The panels were generated by hand on 07/09/2026 and then never
#   rebuilt, while every feed underneath them kept updating daily. By 18/09 a
#   rebuild changed 43 of the 43 panels: mental health published 84 matched
#   awards against 101, primary care 100 against 107, pharmacy 244 against 248.
#   Members were reading a fortnight-old snapshot of a daily feed.
#
#   Nothing flagged it because nothing was watching: speciality-news.yml's own
#   header cites "the exact pattern already proved live by speciality-panels.yml
#   (07/09/2026)", but no such workflow had ever existed — `git log` on this path
#   was empty until this commit. The loader pattern was proved; the workflow was
#   assumed. That comment is corrected in the same change.
#
# TIMING. 07:00 UTC, deliberately after every writer that feeds it:
#   atamis-opportunities  00:50   -> framework-awards.json
#   supplier-capture      02:20   -> frameworks.json
#   company-intelligence  Mon 03:10 -> frameworks.json
#   framework-awards      06:10   -> framework-awards.json
#   open-tenders          06:25   -> open-tenders.json
#   drug-tariff           06:40   -> drug-tariff.json
# Building before those would publish a panel set already a day behind, which is
# the failure this workflow exists to end. Same reasoning as differentiator.yml's
# "after every writer that feeds it".

on:
  schedule:
    - cron: "0 7 * * *"      # daily 07:00 UTC, after every feed this reads
  workflow_dispatch: {}

# Same group as every other writer to this repo (see weekly-refresh.yml's own
# comment, 26/07/2026 incident) — a push here queues behind another writer
# instead of racing it.
concurrency:
  group: msh-compare-data-writer
  cancel-in-progress: false
permissions:
  contents: write

jobs:
  rebuild:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Rebuild the speciality panels
        run: python3 scripts/build_speciality_panels.py
      - name: Panel invariants — the wound care panel cannot start showing X-ray cabinets
        # Cheap (~7s) and it reads the panels this job has just written, so it
        # catches a bad rebuild BEFORE the publish gate and before the commit.
        # It rebuilds the panels itself, which is harmless here: same inputs,
        # same output, and this checkout is thrown away.
        run: python3 test_speciality_panels.py
      - name: Publish gate — nothing commits until this passes
        run: python3 verify.py
      - name: Commit and push
        run: |
          git config user.name "hub-bot"
          git config user.email "contact@elevateandthrive.uk"
          git add data/speciality-panels/
          git diff --cached --quiet || git commit -m "speciality panels rebuild $(date -u +'%F %H:%M')"
          pushed=0
          for attempt in 1 2 3 4 5; do
            if git push; then
              echo "pushed on attempt $attempt"
              pushed=1
              break
            fi
            echo "push rejected (attempt $attempt) — rebasing and re-gating"
            git fetch origin
            git rebase origin/main
            python3 verify.py
          done
          if [ "$pushed" != "1" ]; then
            echo "push still rejected after 5 attempts — next scheduled run will carry it"
          fi
      - name: Phone alert if the panels stopped rebuilding (ntfy)
        if: failure()
        run: |
          curl -s -H "Title: Medical Sales Hub - SPECIALITY PANELS DID NOT REBUILD" -H "Priority: default" -H "Tags: warning" \
            -d "The speciality panels rebuild failed. The Hub keeps serving the last good panels, so nothing is wrong on the page - but they are getting staler every day this stays red. github.com/louisehoult-beep/msh-compare-data/actions" \
            ntfy.sh/eth-hub-lou-4437
