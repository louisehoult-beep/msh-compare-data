name: ICC product matrices and CCF reference (monthly)

# WHY THIS WORKFLOW EXISTS (added 28/08/2026)
#
# Two slow-moving reference sources, refreshed monthly because neither changes
# often enough to justify a daily job.
#
# 1. INFORMATION FOR CLINICAL CHOICE (ICC) — NHS Supply Chain's Clinical
#    Collaboration Teams publish, free and without login, specification-level
#    comparison material for clinically similar products. This is the same grain
#    as the Hub's Differentiator, authored by the NHS, and every product row
#    carries an NPC code so it joins to nhssc-cache.json without name matching.
#
#    ⚠️ CORRECTED 07/09/2026. This block used to say the support documents are
#    "narrative support documents, not grids". They are not: 67 of the 74 carry
#    a full product grid drawn into the PDF, and they are now parsed
#    (scripts/icc_pdf_matrix.py), giving 68 categories and ~1,617 product rows
#    instead of 1 category and 167.
#
#    ⚠️ Documents linked from the ICC page are taken, and so are documents we
#    already hold that the page has SINCE STOPPED linking — but only where a
#    HEAD request proves NHS Supply Chain still serves the file at its own URL.
#    Unlinked is not withdrawn, and the difference is checked, never assumed.
#    This is what keeps wound care in the data: all six wound care documents
#    were delisted between 28/08 and 07/09/2026 and all six still serve. A file
#    that 404s is dropped. Filenames are still never guessed — every one of
#    these came off the ICC page originally.
#
#    The counts are reported every run, so a jump or a drop is visible rather
#    than silent.
#
#    The ~26MB of source PDFs are NOT committed. On Lou's machine they land in
#    the ICC library on OneDrive; on this runner they go to a scratch directory
#    and are discarded. Only the parsed JSON is committed.
#
# 2. CCF REFERENCE — the 18 accredited NHS framework hosting organisations, plus
#    NHS England's published supplier-engagement position. There is no public
#    national register of frameworks with their awarded suppliers, but the host
#    list answers "who runs this framework", which is the question behind most
#    framework confusion.
#
#    ⚠️ The CCF step FAILS DELIBERATELY if the host count moves off 18. A changed
#    accredited-host list is a real event that needs a human look, not a silent
#    overwrite of a list the Hub presents as complete. When that happens, read
#    the page, update KNOWN_HOSTS and EXPECTED_HOST_COUNT in the script, and
#    re-run. Do not reach for --allow-count-change to make the job go green.
#
#    ⚠️ CHANGED 04/11/2026: THE CCF REFRESH NOW RUNS FROM THE MAC, NOT HERE.
#    england.nhs.uk answered this runner with an empty HTTP 202 on every attempt
#    from 03/10/2026 (three tries each, 20s and 40s apart), and the same page reads
#    normally from Lou's Mac. Same family as icb-watch.yml. The overnight
#    orchestrator job `ccf-reference-refresh` (monthly, 2nd) runs
#    scripts/refresh_ccf_reference.py and lands the file. This workflow only checks
#    the committed file is not stale and goes red, naming the file, if it is.
#
# ⚠️ NEEDS NO SECRET. Both sources are public.
# ⚠️ NOTHING ELSE MAY WRITE data/icc-catalogue.json or data/icc-matrices.json.
#    This is their only writer. data/ccf-reference.json has one writer too: the
#    Mac job `ccf-reference-refresh`.

on:
  schedule:
    # 19:00 UTC on the 3rd of each month — on its own in the evening, clear of
    # the daily writers. See docs/writer-queue-schedule.md.
    - cron: "0 19 3 * *"
  workflow_dispatch:

concurrency:
  group: msh-compare-data-writer
  cancel-in-progress: false
permissions:
  contents: write

jobs:
  icc-and-ccf:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      # pdfplumber is needed to read the grids drawn inside the support-document
      # PDFs. Without it refresh_icc.py still publishes the .xlsx matrix and says
      # loudly that it skipped the rest; verify.py then fails on the dataset
      # shrinking, so a missing dependency cannot quietly cost 67 categories.
      - name: Install the PDF grid parser
        run: pip install --quiet pdfplumber

      - name: Pull the ICC documents and parse the product matrices
        env:
          ICC_LIBRARY: ${{ runner.temp }}/icc-library
        run: python3 scripts/refresh_icc.py

      # The parser's own invariant gate: row separation, the rule-coverage floor,
      # symbol-font mapping, no-NPC-no-publish, and attribution on every matrix.
      - name: ICC grid invariants — nothing publishes if the parser regressed
        env:
          ICC_LIBRARY: ${{ runner.temp }}/icc-library
        run: python3 test_icc_matrix.py

      - name: Re-stamp the ownership notice and data markers
        run: python3 scripts/stamp_notice.py

      # A push to this repo is a live publish to paying members within seconds.
      # If this fails, the data is wrong: fix the data, never loosen the check.
      # Root rule 13.
      - name: Publish gate — nothing commits until this passes
        run: |
          python3 scripts/prune_calendar.py
          bash scripts/gate.sh
      - name: Commit if changed
        run: |
          git config user.name "icc-ccf-bot"
          git config user.email "actions@github.com"
          git add data/icc-catalogue.json data/icc-matrices.json
          git diff --cached --quiet || git commit -m "ICC matrices $(date -u +%F)"
          pushed=0
          for attempt in 1 2 3; do
            if git push; then
              echo "pushed on attempt $attempt"
              pushed=1
              break
            fi
            echo "push rejected (another writer landed first), attempt $attempt of 3."
            git fetch origin
            git reset --hard origin/main
            ICC_LIBRARY="${{ runner.temp }}/icc-library" python3 scripts/refresh_icc.py
            python3 scripts/stamp_notice.py
            bash scripts/gate.sh || { echo "GATE FAILED after re-fetch - refusing to push"; exit 1; }
            git add data/icc-catalogue.json data/icc-matrices.json
            git diff --cached --quiet || git commit -m "ICC matrices $(date -u +%F) (retry)"
            sleep 5
          done
          if [ "$pushed" -ne 1 ]; then
            echo "could not push after 3 attempts - failing loudly rather than dropping the work"
            exit 1
          fi

      # The Mac job refreshes monthly, so anything over 45 days means it has missed
      # a run. Stale data is what this step exists to report, so it stays red.
      - name: Fail loudly if data/ccf-reference.json is stale
        run: |
          python3 - <<'PY'
          import datetime as dt, json, sys
          g = json.load(open("data/ccf-reference.json"))["generated"]
          age = (dt.datetime.now(dt.timezone.utc) - dt.datetime.fromisoformat(g)).days
          print("data/ccf-reference.json generated %s, %d days ago" % (g, age))
          if age > 45:
              print("::error::data/ccf-reference.json is %d days old. The Mac job ccf-reference-refresh (overnight orchestrator, monthly on the 2nd) has not landed a refresh." % age)
              sys.exit(1)
          PY
