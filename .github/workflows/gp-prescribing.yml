name: GP prescribing by ICB (NHSBSA EPD, monthly source)

# WHY THIS WORKFLOW EXISTS (added 29/09/2026)
#
# Builds data/gp-prescribing/ (index.json + one shard per BNF section) from the
# NHSBSA English Prescribing Dataset with SNOMED code, via the CKAN datastore SQL
# API. See scripts/refresh_gp_prescribing.py for the rules; the hospital prescribing
# tool's data (data/hospital-prescribing/) is the trust-level sibling.
#
# TIMING. NHSBSA publishes each EPD_SNOMED month about seven weeks after it ends.
# Resource creation dates on the package, June 2025 to September 2026, fell on the
# 16th to the 24th of the month (e.g. 202607 on 18/09/2026, 202606 on 21/08/2026).
# So the job runs daily from the 15th to the 28th. `--if-new` makes a day with no
# new month a no-op in a few seconds; the day a month lands, the full rebuild runs
# (3 to 5.5 minutes measured). Nothing commits when nothing changed.
#
# GATES. The builder refuses a month that does not reconcile to NHSBSA's own
# server-side section totals; verify.py (via gate.sh, like every other writer)
# re-checks that every shard adds up, every ICB is one of the current 36, and the
# series has no closed-up gaps. Nothing commits until both pass.
#
# The files live in data/gp-prescribing/, a subdirectory, like
# data/hospital-prescribing/: stamp_notice.py only stamps top-level data/*.json,
# and the index carries NHSBSA's OGL attribution instead.

on:
  schedule:
    # 07:20 UTC, days 15-28: clear of drug-tariff (06:40) and the overnight writers.
    - cron: "20 7 15-28 * *"
  workflow_dispatch:
    inputs:
      force:
        description: "Rebuild even if no new month has been published (yes/no)"
        required: false
        default: "no"

concurrency:
  group: msh-compare-data-writer
  cancel-in-progress: false
permissions:
  contents: write

jobs:
  gp-prescribing:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Build GP prescribing by ICB
        run: |
          if [ "${{ github.event.inputs.force }}" = "yes" ]; then
            python3 scripts/refresh_gp_prescribing.py
          else
            python3 scripts/refresh_gp_prescribing.py --if-new
          fi

      - name: Publish gate — the same one every other writer runs
        run: bash scripts/gate.sh

      - name: Commit and push
        run: |
          git config user.name "hub-bot"
          git config user.email "contact@elevateandthrive.uk"
          git add data/gp-prescribing/
          if git diff --cached --quiet; then
            echo "no change to commit"
            exit 0
          fi
          latest=$(python3 -c "import json;print(json.load(open('data/gp-prescribing/index.json'))['periods'][-1])")
          git commit -m "GP prescribing by ICB to $latest ($(date -u +%F))"
          pushed=0
          for attempt in 1 2 3 4 5; do
            if git push; then
              echo "pushed on attempt $attempt"
              pushed=1
              break
            fi
            echo "push rejected (attempt $attempt), rebasing and re-gating"
            git fetch origin
            git rebase origin/main
            bash scripts/gate.sh || { echo "GATE FAILED after rebase - refusing to push"; exit 1; }
            sleep 5
          done
          if [ "$pushed" != "1" ]; then
            echo "could not push after 5 attempts - failing loudly rather than dropping the work"
            exit 1
          fi
