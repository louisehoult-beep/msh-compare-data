name: Supplier range capture (own-site product ranges)

# WHY THIS WORKFLOW EXISTS (added 12/08/2026)
#
# Tier 3 of the Company Report — the company's OWN full product range, grouped by
# the company's OWN divisions — is captured by scripts/crawl_supplier_site.py.
# Until today that script was only ever run by hand inside a session, and it had
# reached 21 of 548 suppliers in five weeks. Two things caused that:
#
#   1. NOTHING SCHEDULED IT. `company-intelligence-capture-process.md` said a
#      `supplier-deep-capture` task ran daily at 05:50 with 6 suppliers a run.
#      No such task existed in the scheduler. The commit history shows captures
#      on 07, 09, 11 and 12 August and none on 08 or 10 — session-driven, not
#      automatic.
#   2. THE SWEEP COULD NOT ADVANCE. `--auto` picked targets that were "on a
#      framework AND not already captured". A refusal wrote nothing, so a
#      refused supplier stayed eligible and ranked first again next run. Every
#      run re-attempted the same top refusals — Fannin, GE HealthCare, Medtronic,
#      B. Braun, Stryker — and never reached supplier seven. Fixed the same day
#      by recording refusals in supplier-products.json under `refusals`.
#
# A crawl is slow in wall-clock and nearly free in CPU: robots.txt, then a
# WordPress API probe, then a sitemap, each up to 30s against hosts that are
# often dead. Measured 12/08/2026: ~13-26s per supplier. 350 suppliers is
# therefore 1.5-2.5 HOURS of mostly waiting, which is why this belongs on a
# runner and not in an interactive session with a 3-minute shell limit.
#
# ⚠️ NEEDS NO SECRET. It reads public company websites only.

on:
  schedule:
    - cron: "20 2 * * *"      # daily 02:20 UTC, ahead of refresh.yml at 03:15
  workflow_dispatch:
    inputs:
      limit:
        description: "How many suppliers to attempt this run"
        required: false
        default: "200"
      retry_refused:
        description: "Re-attempt suppliers already recorded as refused (true/false)"
        required: false
        default: "false"

# Same reason as every other writer in this repo: they share one branch, and on
# 26/07/2026 a 49-minute job lost its push to a writer that landed inside its
# window. Serialise rather than race.
concurrency:
  group: msh-compare-data-writer
  cancel-in-progress: false
permissions:
  contents: write

jobs:
  capture:
    runs-on: ubuntu-latest
    # Generous ON PURPOSE. The job is I/O-bound on other people's servers and a
    # short cap would silently truncate the sweep, which reads as "we captured
    # everything there was" when it means "we ran out of clock".
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      # Added 15/09/2026: crawl_supplier_site.py's get() now retries a
      # script-only HTTP 403 through a real headless browser before giving up
      # (see browser_get() in that file) — bot-management on TLS/JS
      # fingerprint blocks a plain fetch on some sites while happily serving a
      # real browser the same public pages. Only reached on 403, and
      # allowed()'s robots.txt check still honours a genuine refusal —
      # including one specifically naming ClaudeBot or anthropic-ai — so this
      # never crawls a site that has said no to Claude by name.
      - name: Install headless browser for the 403 fallback
        run: |
          pip install playwright
          python -m playwright install --with-deps chromium

      - name: Capture own-site product ranges
        run: |
          python3 scripts/crawl_supplier_site.py \
            --auto \
            --limit "${{ github.event.inputs.limit || 200 }}" \
            ${{ github.event.inputs.retry_refused == 'true' && '--retry-refused' || '' }}

      - name: Report coverage
        run: |
          python3 - <<'EOF'
          import json
          d = json.load(open("data/supplier-products.json"))
          seed = json.load(open("data/supplier-seed.json"))["suppliers"]
          ranges, refused = len(d["suppliers"]), len(d.get("refusals", {}))
          print("ranges captured : %d" % ranges)
          print("refusals on record: %d" % refused)
          print("seed suppliers  : %d" % len(seed))
          print("accounted for   : %d of %d" % (ranges + refused, len(seed)))
          EOF

      # WHY THE LEDGER IS REBUILT HERE (added 13/09/2026 after this workflow
      # failed its own gate on 13/09). This run RECORDS REFUSALS: a supplier
      # whose site is read and found uncrawlable goes into
      # data/supplier-products.json's `refusals`. verify.py's coverage-ledger
      # check then requires every awarded supplier carrying a refusal to appear
      # in that framework row's `refusedSuppliers` (^o404) — and nothing else in
      # this repo regenerates the ledger, so the first new refusal of a supplier
      # sitting in a framework's notCrawled bucket made the gate FAIL and the
      # whole night's crawl was discarded uncommitted. Three rows failed that
      # way on 13/09 (Carleton Medical, Fulbourn Medical, Relianace High -Tech).
      # The ledger is a pure local derivation over frameworks.json,
      # supplier-products.json and differentiator.json — no network, ~0.4s — so
      # rebuilding it in the same run that changed its inputs is the cheap,
      # correct answer. It must run BEFORE stamp_notice.py: the rebuild writes a
      # fresh file with no `_notice` block, and an unstamped data file fails the
      # gate on its own.
      - name: Rebuild the coverage ledger over this run's refusals
        run: python3 scripts/build_coverage_ledger.py

      # build_supplier_index.py is NOT run here. This workflow writes the one
      # crawled file plus the ledger derived from it directly above; the index
      # rebuild belongs to refresh.yml, 55 minutes later, and running it twice a
      # night just doubles the chance of a writer collision.
      - name: Re-stamp the ownership notice and data markers
        run: python3 scripts/stamp_notice.py

      # A push to this repo is a live publish to paying members within seconds.
      # There is no staging step and no review. If this fails, the data is
      # wrong: fix the data, never loosen the check. Root rule 13.
      - name: Publish gate — nothing commits until this passes
        run: |
          python3 scripts/prune_calendar.py
          python3 verify.py
      - name: Commit if changed
        run: |
          git config user.name "supplier-capture-bot"
          git config user.email "actions@github.com"
          # docs/COVERAGE-LEDGER.md is written by build_coverage_ledger.py in the
          # same pass as the JSON, and it lives outside data/ — staging only
          # `data` would leave the human-readable ledger drifting behind the
          # file it describes on every run.
          git add data docs/COVERAGE-LEDGER.md
          git diff --cached --quiet || git commit -m "Supplier range capture $(date -u +%F)"
          pushed=0
          for attempt in 1 2 3 4 5; do
            if git push; then
              echo "pushed on attempt $attempt"
              pushed=1
              break
            fi
            echo "push rejected (another writer landed first). Rebasing and re-running the gate, attempt $attempt of 5."
            git pull --rebase --autostash
            python3 verify.py || { echo "GATE FAILED after rebase - refusing to push"; exit 1; }
            sleep 5
          done
          if [ "$pushed" -ne 1 ]; then
            echo "could not push after 5 attempts - failing loudly rather than dropping the work"
            exit 1
          fi
