name: Sofia insights refresh (Analysts page, page 6790)

# Every item is re-read from its official source; anything that fails is held and never written.
# The page shows only items verified on today's London date, so a failed or late run shows
# nothing rather than yesterday's facts.
#
# TWO WRITERS of data/sofia-insights.json and state/sofia-held.json: this workflow, and the Mac
# job ops/launchagents/sofia-insights-mac.sh. www.england.nhs.uk answers this runner with an empty
# HTTP 202 (seen 27/11/2026), so its pages are read from the Mac; a run here keeps what the Mac
# verified earlier the same day (refresh_sofia_insights.py, carry_today).

on:
  schedule:
    # GitHub often starts a schedule hours late, so there are three chances before the working day.
    - cron: "20 0 * * *"
    - cron: "40 3 * * *"
    - cron: "10 6 * * *"
  workflow_dispatch:

concurrency:
  group: msh-writer-sofia-insights
  cancel-in-progress: false
permissions:
  contents: write

jobs:
  sofia-insights:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install the PDF text tool
        run: sudo apt-get update -qq && sudo apt-get install -y -qq poppler-utils

      - name: Read every source today
        run: python3 scripts/refresh_sofia_insights.py

      - name: Sofia gate (every item verified today, official source, no advice)
        run: python3 scripts/check_sofia_insights.py

      - name: Re-stamp the ownership notice and data markers
        run: python3 scripts/stamp_notice.py

      - name: Publish gate (nothing commits until this passes)
        run: bash scripts/gate.sh

      - name: Commit if changed
        run: |
          git config user.name "sofia-insights-bot"
          git config user.email "actions@github.com"
          git add data/sofia-insights.json state/sofia-held.json
          git diff --cached --quiet || git commit -m "Sofia insights $(date -u +%F)"
          pushed=0
          for attempt in 1 2 3 4 5; do
            if git push; then pushed=1; break; fi
            echo "push rejected, attempt $attempt of 5: rebuilding on the latest main"
            git fetch origin
            git reset --hard origin/main
            python3 scripts/refresh_sofia_insights.py
            python3 scripts/check_sofia_insights.py
            python3 scripts/stamp_notice.py
            bash scripts/gate.sh
            git add data/sofia-insights.json state/sofia-held.json
            git diff --cached --quiet || git commit -m "Sofia insights $(date -u +%F) (retry)"
            sleep 5
          done
          if [ "$pushed" -ne 1 ]; then echo "could not push after 5 attempts"; exit 1; fi
