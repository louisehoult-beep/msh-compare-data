name: One-off notice status check (2026-09-16)

on:
  workflow_dispatch: {}

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fetch each expired-resolve-date notice and print its current status
        run: |
          python3 - <<'PY'
          import urllib.request, re, sys

          urls = [
            ("continence / Baxter FTK648",
             "https://www.supplychain.nhs.uk/icn/supply-issues-baxter-healthcare-ltd-bladder-irrigation-set-ftk648/"),
            ("skin-prep / B Braun cannulation packs",
             "https://www.supplychain.nhs.uk/icn/supply-issues-b-braun-cannulation-packs-chloraprep-multiple-products/"),
            ("cardiology / Fannin Skintact FDK317+FDK049",
             "https://www.supplychain.nhs.uk/icn/field-safety-notice-fannin-skintact-defibrillation-electrodes/"),
            ("pathology / CellPath KTH110",
             "https://www.supplychain.nhs.uk/icn/supply-issues-cellpath-microscope-slide-kth110/"),
            ("unsorted / BD FWC244",
             "https://www.supplychain.nhs.uk/icn/supply-issues-becton-dickinson-uk-ltd-hypodermic-syringe-fwc244-3/"),
            ("unsorted / Scot Young MLE603+MLE611",
             "https://www.supplychain.nhs.uk/icn/supply-issues-scot-young-research-ltd-mops-mle603-and-mle611/"),
            ("unsorted / Vygon FSB730",
             "https://www.supplychain.nhs.uk/icn/supply-issues-vygon-uk-ltd-needlefree-connection-systems-fsb730/"),
            ("unsorted / Pennine FWP084+FDR686",
             "https://www.supplychain.nhs.uk/icn/supply-issues-pennine-tube-yankauer-suction-fwp084/"),
            ("unsorted / multiple swabs cotton bandages",
             "https://www.supplychain.nhs.uk/icn/supply-issues-multiple-suppliers-swabs-cotton-wool-and-bandages/"),
            ("unsorted / BD FWC082",
             "https://www.supplychain.nhs.uk/icn/supply-issues-becton-dickinson-blood-gas-syringe-fwc082/"),
            ("unsorted / BD FWC062",
             "https://www.supplychain.nhs.uk/icn/supply-issues-becton-dickinson-uk-ltd-stock-oxford-hypodermic-syringe-fwc062/"),
          ]

          KEYWORDS = ["resolved", "Resolved", "RESOLVED", "anticipat", "Anticipat",
                      "expected", "Expected", "available again", "back in stock",
                      "suspended", "Suspended", "Updated", "updated", "no longer",
                      "closed", "Closed", "withdrawn"]

          for label, url in urls:
              print("=" * 100)
              print(f"### {label}")
              print(f"URL: {url}")
              try:
                  req = urllib.request.Request(url, headers={"User-Agent": "Mozilla/5.0 (compatible; ETH-Hub-check/1.0)"})
                  with urllib.request.urlopen(req, timeout=25) as r:
                      status = r.status
                      html = r.read().decode("utf-8", "replace")
              except Exception as e:
                  print(f"FETCH FAILED: {type(e).__name__}: {e}")
                  print()
                  continue
              print(f"HTTP status: {status}")
              text = re.sub(r'<script[^>]*>.*?</script>', ' ', html, flags=re.S)
              text = re.sub(r'<style[^>]*>.*?</style>', ' ', text, flags=re.S)
              text = re.sub(r'<[^>]+>', ' ', text)
              text = re.sub(r'&nbsp;', ' ', text)
              text = re.sub(r'\s+', ' ', text).strip()
              seen_spans = set()
              hits = 0
              for kw in KEYWORDS:
                  for m in re.finditer(re.escape(kw), text):
                      idx = m.start()
                      span = idx // 150
                      if span in seen_spans:
                          continue
                      seen_spans.add(span)
                      hits += 1
                      if hits > 6:
                          break
                      print(f"  [{kw}] ...{text[max(0,idx-90):idx+220]}...")
                  if hits > 6:
                      break
              if hits == 0:
                  print("  No status keyword found. First 500 chars of body text:")
                  print(f"  {text[:500]}")
              print()
          PY
