name: Verify (publish gate)

# Runs on EVERY push and pull request. The Hub fetches this repo's files
# directly, so a push IS a publish — there is no staging step between this
# repo and what a paying member sees on WP page 1109.
#
# On 24/07/2026 this repo published 145 false job changes about named NHS staff
# because nothing checked derived data before it went out. verify.py is that
# check. If this workflow is red, what is on the Hub right now is suspect —
# fix it or revert, do not merge past it.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch: {}

jobs:
  verify:
    runs-on: ubuntu-latest
    # 30, not 15. test_verify.py runs the whole gate once per case, so the wall
    # clock grows with the case count, and on 06/08/2026 it crossed 15 minutes:
    # runs at 15:55 and 16:14 were CANCELLED on the timeout and reported as
    # failures. A timeout that fires looks exactly like bad data on the runs
    # list, and this repo treats a red gate as "members may be seeing something
    # wrong right now" — so a false red here costs real attention, and it also
    # blocks the refresh workflows, which run the gate before they commit.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 2          # verify.py compares against HEAD for the shrink guard
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Publish gate
        run: python3 verify.py
      # test_verify.py MOVED to msh-hub-private on 17/08/2026.
      # Its cases are built around data/trust-contacts.json and
      # data/people-moves.json, which are named NHS personal data and no
      # longer live in this public repo. The suite runs there, unchanged and
      # in full, against the real data. verify.py — the actual publish gate —
      # still runs here on every push and in the pre-push hook.
      # OUTSTANDING: build synthetic fixtures so the non-contact cases can run
      # here too, otherwise this repo's verify.py can drift untested.
      - name: Phone alert if the live data is bad (ntfy)
        if: failure()
        run: |
          curl -s -H "Title: Medical Sales Hub - LIVE DATA FAILED VERIFY" -H "Priority: high" -H "Tags: rotating_light" \
            -d "msh-compare-data failed its publish gate. The Hub serves this repo directly, so members may be seeing bad data right now. github.com/louisehoult-beep/msh-compare-data/actions" \
            ntfy.sh/eth-hub-lou-4437
