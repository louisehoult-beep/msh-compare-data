name: Verify (publish gate)

# Runs on EVERY push and pull request. The Hub fetches this repo's files
# directly, so a push IS a publish — there is no staging step between this
# repo and what a paying member sees on WP page 1109.
#
# On 24/07/2026 this repo published 145 false job changes about named NHS staff
# because nothing checked derived data before it went out. verify.py is that
# check. If this workflow is red, what is on the Hub right now is suspect —
# fix it or revert, do not merge past it.
#
# TWO JOBS, NOT TWO STEPS (04/09/2026)
#   They were one job. verify.py takes about four minutes; test_verify.py runs
#   the whole gate once per case and takes roughly six times that, so the pair
#   crossed 15 minutes on 06/08/2026 and 30 minutes on 04/09/2026, and on both
#   dates the runs were CANCELLED on the timeout.
#
#   Sharing a job made that worse than slow. The steps run in order, so a
#   self-test that overran killed the job AFTER verify.py had already passed —
#   and the failure alert says "members may be seeing bad data right now". Every
#   cancelled run on 04/09 fired that alarm about data the gate had just
#   cleared. It also blocks the refresh workflows, which run the gate before
#   they commit, so the data stops moving for a reason that is not real.
#
#   Split, they run in parallel and say different things:
#     gate      — is the data going to members sound? Four minutes. This is the
#                 one that means "members may be seeing bad data".
#     self-test — can the gate still catch what it was built to catch? Slow, and
#                 a real failure here means the gate is untrustworthy, not that
#                 the live data is bad.
#
#   The self-test's 45 minutes is headroom, not a target, and it grows with the
#   case count: ~26 minutes on 04/09/2026, 43-44 by 16/09 — three runs that day
#   cleared the limit by under a minute. Nothing was wrong with it; the suite
#   runs the whole gate once per case, so 105 cases x one ~20s verify.py run on
#   a runner IS 40 minutes.
#
#   THE CASES NOW RUN IN PARALLEL (17/09/2026), which is what the note here said
#   to do when it next crowded the limit, rather than raising the number again.
#   Four workers, each with its own copy of the repo — a shared copy cannot work
#   because every case deliberately breaks a data file. See the block above
#   _run_shard in test_verify.py for why it shards rather than queues, and why
#   spawn is requested explicitly. The 45 minutes stays: it is now roughly four
#   times the headroom it was, which is the point.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch: {}

jobs:
  gate:
    name: Publish gate (live data)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 2          # verify.py compares against HEAD for the shrink guard
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Publish gate
        run: python3 verify.py
      - name: Phone alert if the live data is bad (ntfy)
        if: failure()
        run: |
          curl -s -H "Title: Medical Sales Hub - LIVE DATA FAILED VERIFY" -H "Priority: high" -H "Tags: rotating_light" \
            -d "msh-compare-data failed its publish gate. The Hub serves this repo directly, so members may be seeing bad data right now. github.com/louisehoult-beep/msh-compare-data/actions" \
            ntfy.sh/eth-hub-lou-4437

  units:
    name: Unit tests (do the repo's own tests still pass?)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 2
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      # ADDED 18/09/2026. Until today this repo had 25 test_*.py files at its
      # root and SIX of them ran anywhere. The other nineteen were written,
      # committed and then never executed again — and four were already red on
      # clean main, one since 03/09. The same fortnight of silence let six
      # company-match override keys go stale and publish a wrong company number
      # to paying members (^o96).
      #
      # scripts/run_unit_tests.py holds the split and, more importantly, REFUSES
      # if any test_*.py is in neither its RUN list nor its KNOWN_RED list. That
      # is the part that stops the rot coming back: a test added tomorrow cannot
      # quietly join the nineteen.
      #
      # ~45s, nearly all of it test_dead_company_check.py. Its own job, not a
      # step on the gate, for the reason the block at the top of this file
      # gives: a slow or failing test must not kill a job that has already
      # cleared the live data and fire the "members may be seeing bad data"
      # alarm about data that is fine.
      - name: Repo unit tests
        run: python3 scripts/run_unit_tests.py
      - name: Phone alert if the repo's own tests broke (ntfy)
        if: failure()
        run: |
          curl -s -H "Title: Medical Sales Hub - UNIT TESTS FAILED" -H "Priority: default" -H "Tags: warning" \
            -d "msh-compare-data's unit tests failed. This does NOT mean the live data is bad - the publish gate reports separately. github.com/louisehoult-beep/msh-compare-data/actions" \
            ntfy.sh/eth-hub-lou-4437

  selftest:
    name: Gate self-test (does the gate still catch things?)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 2
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      # test_verify.py is BACK, on synthetic fixtures (17/08/2026).
      #
      # It left this repo earlier the same day with data/trust-contacts.json and
      # data/people-moves.json, which are named NHS personal data and now live
      # only in msh-hub-private. Every contacts, tags and moves case reads those
      # files off disk, so without them a third of the suite skipped — and the
      # public verify.py, which is the gate the Hub's data actually passes
      # through, ran untested and free to drift from the private copy.
      #
      # tests/fixtures/contacts.py now manufactures a shaped stand-in for the
      # run: invented names, .invalid addresses, real ODS codes. Two cases still
      # skip HERE and say why in their own output — the replay of the 24/07
      # incident (its commit was rewritten out by the history purge) and the
      # retention case (the harvester holding RETENTION_MONTHS is private). Both
      # run in full in msh-hub-private, and the 24/07 fault is covered here by a
      # synthetic equivalent rather than left uncovered.
      - name: Prove the gate still catches the incident it was built for
        run: python3 test_verify.py
      # 19/09/2026: Hub search returned nothing for "Molnlycke" or "Ossur" because
      # every normaliser stripped to [a-z0-9], turning an accented letter into a
      # SPACE instead of its base letter. A "no results" on this Hub reads as "not
      # on the framework", so this is a correctness check, not a nicety. The suite
      # is data-driven off supplier-seed.json, so a new accented supplier is
      # covered without anyone remembering the file exists.
      - name: Prove an accented supplier name is findable without its accents
        run: python3 test_ascii_folding.py
      - name: Phone alert if the gate itself is untrustworthy (ntfy)
        if: failure()
        run: |
          curl -s -H "Title: Medical Sales Hub - GATE SELF-TEST FAILED" -H "Priority: high" -H "Tags: warning" \
            -d "msh-compare-data's gate self-test failed or timed out. This does NOT mean the live data is bad - the publish gate reports separately. It means verify.py may no longer catch what it was built to catch. github.com/louisehoult-beep/msh-compare-data/actions" \
            ntfy.sh/eth-hub-lou-4437
