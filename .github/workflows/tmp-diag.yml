name: tmp diag (delete before merge)
on:
  push:
    branches: [claude/digital-sources]
jobs:
  d:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: frameworks
        run: python3 scripts/refresh_digital_frameworks.py --out /tmp/df.json; python3 -c "import json;d=json.load(open('/tmp/df.json'));print(len(d['frameworks']),[e['name'] for e in d['frameworks']]);print(d['notAdded'])"
      - name: airlock
        run: python3 scripts/refresh_ai_airlock.py --out /tmp/ai.json || echo AIRLOCK-FAILED
      - name: dspt
        run: python3 scripts/refresh_dspt_suppliers.py || echo DSPT-FAILED
      - name: sources
        run: python3 scripts/refresh_digital_sources.py --out /tmp/ds.json || echo SOURCES-FAILED
      - name: fdp
        run: python3 scripts/refresh_fdp_live.py --dry-run || echo FDP-FAILED
