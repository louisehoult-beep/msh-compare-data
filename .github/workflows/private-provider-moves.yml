name: Private provider moves refresh (Private Sector tracker, page 1666)

# WHY THIS WORKFLOW EXISTS (added 08/09/2026)
#
# scripts/refresh_private_provider_moves.py and data/private-provider-moves.json
# were added 08/09/2026 as Hub build 3/3 (OUTSTANDING ^o138) — a live tracker
# panel added to the existing "Selling to the Private Sector" page (WP page
# 1666, medsalesintelligencehub.co.uk), sequenced behind build 1/3 (Tenders
# Tracker, page 3198) and build 2/3 (MHRA Regulatory Desk, page 3483). Full
# build record: 00-Planning/Workstreams/WS-private-provider-tracker.md and
# "Process flows for all brands/private-provider-tracker-build.md".
#
# Same client-side live-fetch pattern as 3483/3198: the page's own inline
# <script> fetches this file live at page-load time —
#   https://raw.githubusercontent.com/louisehoult-beep/msh-compare-data/main/data/private-provider-moves.json
# — so committing the refreshed JSON to main IS the publish. No page-rebuild
# step, no publish_*.py.
#
# COVERAGE: HCA Healthcare UK, Ramsay Health Care UK, Spire Healthcare (via its
# RNS regulatory announcements on investegate.co.uk) and Nuffield Health.
# Circle Health Group is DELIBERATELY NOT scraped — its site blocks automated
# fetching outright (Cloudflare) and no syndicated alternative was found. The
# page shows this as a stated coverage gap, never silently.
#
# scripts/refresh_private_provider_moves.py is idempotent and additive — it
# re-fetches all four sources fresh every run and merges by URL into the
# existing `_rows`, so a rerun against origin's latest file after a push
# conflict reproduces the same result (same pattern as refresh_mhra_alerts.py).
#
# ⚠️ NEEDS NO SECRET. All four sources are public pages.
#
# ⚠️ NOTHING ELSE MAY WRITE data/private-provider-moves.json. This is its only
# writer.

on:
  schedule:
    # 02:35 UTC daily — ahead of company-press (01:40), clear of supplier-capture
    # (02:20), mhra-alerts (02:50) and refresh.yml (03:15), so this queues rather
    # than collides with them under the shared concurrency group below.
    - cron: "35 2 * * *"
  workflow_dispatch:

concurrency:
  group: msh-compare-data-writer
  cancel-in-progress: false
permissions:
  contents: write

jobs:
  private-provider-moves:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Refresh private provider moves
        run: python3 scripts/refresh_private_provider_moves.py

      - name: Re-stamp the ownership notice and data markers
        run: python3 scripts/stamp_notice.py

      # A push to this repo is a live publish to paying members within seconds.
      # There is no staging step and no review. If this fails, the data is
      # wrong: fix the data, never loosen the check. Root rule 13.
      - name: Publish gate — nothing commits until this passes
        run: python3 verify.py

      - name: Commit if changed
        run: |
          git config user.name "private-provider-moves-bot"
          git config user.email "actions@github.com"
          git add data/private-provider-moves.json
          git diff --cached --quiet || git commit -m "Private provider moves refresh $(date -u +%F)"
          pushed=0
          for attempt in 1 2 3 4 5; do
            if git push; then
              echo "pushed on attempt $attempt"
              pushed=1
              break
            fi
            echo "push rejected (another writer landed first), attempt $attempt of 5."
            git fetch origin
            git reset --hard origin/main
            python3 scripts/refresh_private_provider_moves.py
            python3 scripts/stamp_notice.py
            python3 verify.py || { echo "GATE FAILED after re-fetch - refusing to push"; exit 1; }
            git add data/private-provider-moves.json
            git diff --cached --quiet || git commit -m "Private provider moves refresh $(date -u +%F) (retry)"
            sleep 5
          done
          if [ "$pushed" -ne 1 ]; then
            echo "could not push after 5 attempts - failing loudly rather than dropping the work"
            exit 1
          fi
