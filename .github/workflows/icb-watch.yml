name: ICB watch (structure page 884, Live Desk NHS England panel)

# WHY THIS WORKFLOW EXISTS (added 30/09/2026)
#
# A Hub member in market access asked for Integrated Care Board (ICB) alerts:
# merger status and leadership changes, especially the chief pharmacist /
# medicines lead. scripts/refresh_icb_watch.py builds data/icb-watch.json from
# the NHS Organisation Data Service (which ICBs legally exist), NHS England's
# list of ICB leaders and its merger statement, and each ICB's own leadership
# page (config/icb-leadership-sources.json), plus hand-verified events from
# board papers (config/icb-watch-curated.json).
#
# Two readers, no page-rebuild step:
#   * WP 884 (How the NHS Fits Together) loads app/icb-watch.js, which fetches
#     data/icb-watch.json from raw GitHub at page load.
#   * The Live Desk's NHS ENGLAND NEWS panel: the medical-sales-hub-pipeline
#     `icb_watch` source reads the file's `events` list daily.
#
# Leadership changes are derived from STORED state (the committed file itself),
# so this job must read the previous data/icb-watch.json before writing the new
# one. That is why the retry path re-runs the script on origin's latest file
# rather than text-merging JSON: a re-run on the newer base is the same
# derivation, one day's reads applied once.
#
# ⚠️ NEEDS NO SECRET. Every source is public.
# ⚠️ NOTHING ELSE MAY WRITE data/icb-watch.json. This is its only writer.

on:
  schedule:
    # 04:05 UTC daily: clear of mhra-alerts (02:50), refresh.yml (03:15) and the
    # 05:00 digest, and hours ahead of the pipeline's daily read of the file.
    - cron: "5 4 * * *"
  workflow_dispatch: {}

concurrency:
  group: msh-compare-data-writer
  cancel-in-progress: false
permissions:
  contents: write

jobs:
  icb-watch:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Unit tests for the ICB watch
        run: python3 test_icb_watch.py

      - name: Refresh ICB count, clusters, leaders and events
        run: python3 scripts/refresh_icb_watch.py

      - name: Re-stamp the ownership notice and data markers
        run: python3 scripts/stamp_notice.py

      # A push to this repo is a live publish to paying members within seconds.
      # If this fails, the data is wrong: fix the data, never loosen the check.
      - name: Publish gate — nothing commits until this passes
        run: bash scripts/gate.sh

      - name: Commit if changed
        run: |
          git config user.name "icb-watch-bot"
          git config user.email "actions@github.com"
          git add data/icb-watch.json
          git diff --cached --quiet || git commit -m "ICB watch $(date -u +%F)"
          pushed=0
          for attempt in 1 2 3 4 5; do
            if git push; then
              echo "pushed on attempt $attempt"
              pushed=1
              break
            fi
            echo "push rejected (another writer landed first), attempt $attempt of 5."
            git fetch origin
            git reset --hard origin/main
            python3 scripts/refresh_icb_watch.py
            python3 scripts/stamp_notice.py
            bash scripts/gate.sh || { echo "GATE FAILED after re-run - refusing to push"; exit 1; }
            git add data/icb-watch.json
            git diff --cached --quiet || git commit -m "ICB watch $(date -u +%F) (retry)"
            sleep 5
          done
          if [ "$pushed" -ne 1 ]; then
            echo "could not push after 5 attempts - failing loudly rather than dropping the work"
            exit 1
          fi
