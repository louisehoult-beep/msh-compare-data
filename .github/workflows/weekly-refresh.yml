name: Weekly refresh (NHSSC cache + trust directory)

# Refreshes the two live datasets behind the Hub's Med Sales Tools, weekly and
# laptop-independent:
#  - data/nhssc-cache.json   — product NPC/MPC codes, pack sizes, status and
#                              images from the public NHS Supply Chain pilot
#                              catalogue (merge-preserving: never shrinks;
#                              keeps entity-verified finds and the agent-built
#                              notCatalogue map)
#  - data/prep-config.json   — trustDirectory rebuilt from the official NHS ODS
#                              register (name, ODS code, town, postcode, type),
#                              preserving profiled trusts and all other config
#  - data/trust-map.json     — every legally-live trust with the ICB that
#                              commissions it, for the Stakeholder Mapper's
#                              trust-level drill-down. Same crawl as above.
# Both scripts hard-abort rather than commit a shrunken dataset.

on:
  schedule:
    - cron: "30 4 * * 0"     # Sundays 04:30 UTC
  workflow_dispatch: {}

# ⚠️ ADDED 26/07/2026. All three writers push to this one repo on overlapping
# schedules and none of them had a concurrency group, so a long job could lose a
# race it had already done the work for. On 26/07 the weekly refresh ran for 49
# minutes, then its push was REJECTED ("fetch first") because daily-contacts.yml
# landed at 07:56 inside that window. Three files of computed NHSSC cache and
# trust-directory data were discarded and the trust directory did not refresh
# that week. This group serialises the writers so they queue instead of racing.
concurrency:
  group: msh-compare-data-writer
  cancel-in-progress: false
permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install Playwright
        run: |
          pip install playwright
          python -m playwright install --with-deps chromium
      - name: Refresh trust directory + trust→ICB map (NHS ODS)
        run: python scripts/refresh_trusts.py
      - name: Refresh NHSSC product cache (merge-preserving)
        run: python scripts/refresh_nhssc_cache.py
      - name: Publish gate — nothing commits until this passes
        run: python3 verify.py
      - name: Commit updates
        run: |
          git config user.name "hub-bot"
          git config user.email "contact@elevateandthrive.uk"
          git add data/nhssc-cache.json data/prep-config.json data/trust-map.json
          git diff --cached --quiet || git commit -m "weekly refresh: NHSSC cache + trust directory + trust map $(date -u +'%F')"
          # ⚠️ ADDED 26/07/2026. A bare `git push` here silently threw away completed
          # work whenever another writer landed first. Retry on rebase, and RE-RUN
          # THE GATE after any rebase: the rebase combines this run's data with
          # another writer's, and that combination has not been gated yet. Root
          # CLAUDE.md rule 13 - if the gate fails, the data is wrong, so refuse to
          # push rather than loosening anything.
          pushed=0
          for attempt in 1 2 3 4 5; do
            if git push; then
              echo "pushed on attempt $attempt"
              pushed=1
              break
            fi
            echo "push rejected (another writer landed first). Rebasing and re-running the gate, attempt $attempt of 5."
            git pull --rebase --autostash
            python3 verify.py || { echo "GATE FAILED after rebase - refusing to push"; exit 1; }
            sleep 5
          done
          if [ "$pushed" -ne 1 ]; then
            echo "could not push after 5 attempts - failing loudly rather than dropping the work"
            exit 1
          fi
