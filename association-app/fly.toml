# Hosting for the Association app on Fly.io. Smallest machine, one 1 GB volume for the member database.
app = 'industry-nurses-app'
primary_region = 'lhr'

[build]

[env]
  PORT = '8080'
  DB_PATH = '/data/app.db'
  BASE_URL = 'https://app.medsalesintelligencehub.co.uk'
  MAIL_FROM = 'Industry Nurses Association <noreply@medsalesintelligencehub.co.uk>'

[mounts]
  source = 'ain_data'
  destination = '/data'

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'off'
  auto_start_machines = true
  min_machines_running = 1

[[vm]]
  size = 'shared-cpu-1x'
  memory = '256mb'
