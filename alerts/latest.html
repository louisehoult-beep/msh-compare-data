<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Latest alert · Medical Sales Intelligence Hub</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="theme-color" content="#0B1C33">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Hub alerts">
<style>
  :root { --navy:#0B1C33; --gold:#E0BE8E; --ink:#132238; --dim:#5b6675; --bg:#f6f7f9; --card:#fff; --border:#dfe3ea; }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--ink); font:16px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
  header { background:var(--navy); color:#fff; padding:18px 16px; }
  header .kicker { font-size:11px; letter-spacing:1.6px; text-transform:uppercase; color:var(--gold); font-weight:800; }
  header h1 { margin:4px 0 0; font-size:21px; line-height:1.25; }
  main { max-width:560px; margin:0 auto; padding:16px; }
  .card { background:var(--card); border:1px solid var(--border); border-radius:10px; padding:16px; margin-bottom:14px; }
  h2 { font-size:12px; letter-spacing:1.2px; text-transform:uppercase; color:var(--dim); margin:0 0 8px; }
  .item { display:block; padding:10px 0; border-bottom:1px dashed var(--border); color:var(--ink); text-decoration:none; }
  .item:last-child { border-bottom:0; }
  .item strong { display:block; font-size:15px; line-height:1.35; }
  .item span { font-size:13px; color:var(--dim); }
  .hub { display:block; padding:9px 0; color:var(--navy); font-weight:700; text-decoration:none; border-bottom:1px dashed var(--border); }
  .hub:last-child { border-bottom:0; }
  .dim { color:var(--dim); font-size:14px; margin:0 0 8px; }
  .tiny { font-size:12px; color:var(--dim); }
  a.settings { color:var(--navy); }
</style>
</head>
<body>
<header>
  <div class="kicker">Medical Sales Intelligence Hub</div>
  <h1 id="title">Latest alert</h1>
</header>
<main>
  <div class="card" id="empty" style="display:none">
    <p class="dim">No alert on this phone yet. Alerts come at 9am, 12 noon and 4pm when there is new news in your specialities.</p>
  </div>
  <div class="card" id="news" style="display:none">
    <h2>What's new</h2>
    <div id="items"></div>
    <p class="tiny" id="more" style="display:none"></p>
  </div>
  <div class="card" id="hubcard" style="display:none">
    <h2>On the Hub</h2>
    <div id="hub"></div>
    <p class="tiny">The Hub asks you to log in the first time you open it from here.</p>
  </div>
  <p class="tiny" id="when"></p>
  <p class="tiny"><a class="settings" href="./">Alert settings</a></p>
</main>
<script>
(function () {
  'use strict';
  var $ = function (id) { return document.getElementById(id); };
  function esc(s) {
    return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
    });
  }
  function safeUrl(u) { return /^https:\/\//.test(u || '') ? u : ''; }
  function render(a) {
    if (!a) { $('empty').style.display = 'block'; return; }
    $('title').textContent = a.title || 'Latest alert';
    var items = a.items || [];
    if (items.length) {
      $('items').innerHTML = items.map(function (it) {
        var u = safeUrl(it.u);
        var meta = [it.sp, it.s].filter(Boolean).map(esc).join(' · ');
        return u ? '<a class="item" href="' + esc(u) + '" target="_blank" rel="noopener"><strong>' + esc(it.t) +
                   '</strong><span>' + meta + '</span></a>'
                 : '<div class="item"><strong>' + esc(it.t) + '</strong><span>' + meta + '</span></div>';
      }).join('');
      if (a.more > 0) { $('more').textContent = '+ ' + a.more + ' more on the Hub.'; $('more').style.display = 'block'; }
      $('news').style.display = 'block';
    } else if (a.body) {
      $('items').innerHTML = '<p class="dim">' + esc(a.body) + '</p>';
      $('news').style.display = 'block';
    }
    var hub = (a.hub || []).filter(function (h) { return safeUrl(h.u); });
    if (hub.length) {
      $('hub').innerHTML = hub.map(function (h) {
        return '<a class="hub" href="' + esc(h.u) + '" target="_blank" rel="noopener">Open ' + esc(h.l) + ' &rarr;</a>';
      }).join('');
      $('hubcard').style.display = 'block';
    }
    if (a.receivedAt) {
      $('when').textContent = 'Received ' + new Date(a.receivedAt).toLocaleString('en-GB', { dateStyle: 'medium', timeStyle: 'short' }) + '.';
    }
  }
  if (!('caches' in window)) { render(null); return; }
  caches.open('msh-alerts').then(function (c) { return c.match('latest-alert.json'); })
    .then(function (r) { return r ? r.json() : null; })
    .then(render, function () { render(null); });
})();
</script>
</body>
</html>
