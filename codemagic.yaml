# Codemagic builds for the Live Desk app (livedesk-app/). Added 01/10/2026.
# iPhone builds need a Mac with Xcode; Codemagic supplies one, so no laptop is
# needed. Each run builds, signs and uploads: iOS to TestFlight, Android to the
# Google Play internal testing track. Promotion to the public store is done by
# hand in App Store Connect and Play Console.
#
# Environment group "livedesk" (Codemagic > Teams > Global variables), all secure:
#   GOOGLE_SERVICE_INFO_PLIST   base64 of the Firebase iOS config file
#   GOOGLE_SERVICES_JSON        base64 of the Firebase Android config file
#   REVENUECAT_IOS_KEY          RevenueCat public Apple SDK key (appl_...)
#   REVENUECAT_ANDROID_KEY      RevenueCat public Google SDK key (goog_...)
#   GCLOUD_SERVICE_ACCOUNT_CREDENTIALS  Google Play publishing service account JSON
#   APP_STORE_APPLE_ID          the app's numeric Apple ID (App Store Connect > App Information)
# Integrations: an App Store Connect API key named "Live Desk ASC".
# Code signing: iOS automatic (bundle id below); Android keystore reference
# "livedesk_upload" uploaded in Codemagic > Code signing identities.

workflows:
  livedesk-ios:
    name: Live Desk iOS
    working_directory: livedesk-app
    max_build_duration: 60
    instance_type: mac_mini_m2
    integrations:
      app_store_connect: Live Desk ASC
    environment:
      groups:
        - livedesk
      ios_signing:
        distribution_type: app_store
        bundle_identifier: uk.co.medsalesintelligencehub.livedesk
      node: 22
      xcode: latest
    triggering:
      events:
        - tag
      tag_patterns:
        - pattern: "livedesk-v*"
    scripts:
      - name: Install
        script: npm ci
      - name: Test
        script: npm test
      - name: Build web app
        script: npm run build
      - name: Firebase config
        script: echo "$GOOGLE_SERVICE_INFO_PLIST" | base64 --decode > ios/App/App/GoogleService-Info.plist
      - name: Sync native project
        script: npx cap sync ios
      - name: Signing profiles
        script: xcode-project use-profiles
      - name: Build number
        script: |
          LATEST=$(app-store-connect get-latest-testflight-build-number "$APP_STORE_APPLE_ID" || echo 0)
          cd ios/App && agvtool new-version -all $((LATEST + 1))
      - name: Build ipa
        script: xcode-project build-ipa --project ios/App/App.xcodeproj --scheme App
    artifacts:
      - build/ios/ipa/*.ipa
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true

  livedesk-android:
    name: Live Desk Android
    working_directory: livedesk-app
    max_build_duration: 60
    instance_type: linux_x2
    environment:
      groups:
        - livedesk
      android_signing:
        - livedesk_upload
      node: 22
      java: 21
    triggering:
      events:
        - tag
      tag_patterns:
        - pattern: "livedesk-v*"
    scripts:
      - name: Install
        script: npm ci
      - name: Test
        script: npm test
      - name: Build web app
        script: npm run build
      - name: Firebase config
        script: echo "$GOOGLE_SERVICES_JSON" | base64 --decode > android/app/google-services.json
      - name: Sync native project
        script: npx cap sync android
      - name: Build app bundle
        script: |
          cd android
          ./gradlew bundleRelease -PversionCode=$PROJECT_BUILD_NUMBER
    artifacts:
      - android/app/build/outputs/bundle/release/*.aab
    publishing:
      google_play:
        credentials: $GCLOUD_SERVICE_ACCOUNT_CREDENTIALS
        track: internal
        submit_as_draft: true
