<!-- wp:heading {"level":2} -->
<h2 class="wp-block-heading">Connect the Live Desk app</h2>
<!-- /wp:heading -->

<!-- wp:paragraph -->
<p>Your Hub membership includes the Live Desk app. Tap the button and the app opens, connected to your membership.</p>
<!-- /wp:paragraph -->

<!-- wp:html -->
<div id="msh-ldapp" style="margin:18px 0">
<a id="msh-ldapp-go" class="wp-block-button__link wp-element-button" href="#" style="display:inline-block">Open the Live Desk app</a>
<p id="msh-ldapp-note" style="display:none;margin:12px 0 0;font-size:15px"></p>
</div>
<script>
(function () {
  /* Live Desk app link (01/10/2026). The app opens this page in an in-app
     browser; the member logs in to the Hub if asked; this asks WordPress for
     the signed member pass (WPCode snippet 4510, the same pass Ask the Hub and
     phone alerts use, issued only to plans that open the Live Desk) and hands
     it back to the app through the app's own link scheme. The app sends it to
     the Supabase function livedesk, which checks it before linking.
     Source: msh-compare-data docs/hub-page-livedesk-app-link.html.
     Must sit under the Hub's subscriber-only parent page.
     No double ampersands anywhere in this script: WordPress mangles them. */
  var APP = 'uk.co.medsalesintelligencehub.livedesk://link';
  var go = document.getElementById('msh-ldapp-go');
  var note = document.getElementById('msh-ldapp-note');
  if (!go) { return; }
  function say(t) { note.textContent = t; note.style.display = 'block'; }
  function open() {
    go.textContent = 'Opening...';
    fetch('/wp-admin/admin-ajax.php?action=msh_ask_pass', { credentials: 'same-origin', cache: 'no-store' })
      .then(function (r) { return r.json(); })
      .then(function (j) {
        if (!j || !j.ok) { throw new Error(j ? j.why : 'member'); }
        window.location.href = APP + '?pass=' + encodeURIComponent(j.pass);
        go.textContent = 'Open the Live Desk app';
        say('If the app did not open, make sure it is installed, then tap the button again.');
      })
      .catch(function (err) {
        go.textContent = 'Open the Live Desk app';
        var why = String(err ? err.message : '');
        say(why === 'login' ? 'Please log in to the Hub, then tap the button.'
                            : 'Your Hub plan does not include the Live Desk. You can subscribe inside the app instead.');
      });
  }
  go.addEventListener('click', function (e) { e.preventDefault(); open(); });
  /* Opened from the app (?from=app): go straight through, no extra tap. */
  if (/[?]from=app/.test(window.location.search)) { open(); }
})();
</script>
<!-- /wp:html -->
